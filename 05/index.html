<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>リストの作成と活用</title>
  <style>
    ul {
      list-style-type: none;
      display: flex;
      padding-left: 0px;
    }

    a {
      display: block;
      width: 100px;
      background-color: #333333;
      border-left: solid 15px #FF6666;
      padding: 6px 8px 4px;
      margin-right: 15px;
      font-size: 14px;
      text-decoration: none;
      color: #FFFFFF;
    }

    a:hover {
      background-color: #FF9999;
      font-weight: bold;
      color: #000000;
    }
  </style>
</head>

<body>

  <h1>ナビゲーションメニューの作成</h1>
  <ul>
    <li><a href="http://yahoo.co.jp">トップページ</a></li>
    <li><a href="http://yahoo.co.jp">新着情報</a></li>
    <li><a href="http://yahoo.co.jp">ギャラリー</a></li>
    <li><a href="http://yahoo.co.jp">お問い合わせ</a></li>
    <li><a href="http://yahoo.co.jp">リンク集</a></li>
  </ul>
  <p>メニューをクリックすると、各ページへ移動できます。</p>

  <body>

</html>
